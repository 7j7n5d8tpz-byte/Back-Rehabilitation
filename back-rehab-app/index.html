<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#111820;color:#e8edf2;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 20px) 0}
.wrap{max-width:600px;margin:0 auto;padding:0 16px}
header{padding:18px 0 12px}
h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.3px}
.sub{font-size:13px;color:#8b9bab;margin-top:3px}
h2{font-size:17px;margin:0 0 12px;font-weight:700}
.card{background:#1a232e;border:1px solid #26333f;border-radius:14px;padding:14px;margin-bottom:12px}
.big{display:block;width:100%;padding:17px;border-radius:14px;border:none;
  background:#1d3557;color:#fff;font-size:16px;font-weight:600;margin-bottom:10px;text-align:left}
.big .d{display:block;font-size:12.5px;font-weight:400;color:#a8c2de;margin-top:3px}
.big.alt{background:#1a232e;border:1px solid #2f3d4b;color:#c8d4e0}
.big.alt .d{color:#7b8b9b}
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #26333f}
.row:last-child{border-bottom:none}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-size:14.5px;font-weight:600}
.row .nm span{display:block;font-size:11.5px;color:#7b8b9b;margin-top:2px}
input,textarea,select{background:#111820;border:1px solid #33424f;color:#e8edf2;
  border-radius:9px;padding:10px;font-size:16px;font-family:inherit;width:100%}
input:focus,textarea:focus{outline:none;border-color:#4d7fb8}
.num{width:64px;text-align:center;padding:9px 4px}
.unit{font-size:11px;color:#7b8b9b;width:22px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chips button{padding:9px 14px;border-radius:9px;border:1px solid #33424f;
  background:#1a232e;color:#c8d4e0;font-size:14px}
.chips button.on{background:#1d3557;border-color:#4d7fb8;color:#fff;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0}
.toggle b{font-size:14.5px;font-weight:600}
.sw{width:50px;height:29px;border-radius:15px;background:#2f3d4b;border:none;position:relative;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#8b9bab;transition:.16s}
.sw.on{background:#1d5c40}.sw.on i{left:24px;background:#2fe08f}.sw.on.bad{background:#6e2119}.sw.on.bad i{background:#ff6b57}
.save{display:block;width:100%;padding:17px;border-radius:14px;border:none;
  background:#2fe08f;color:#0c1a13;font-size:16.5px;font-weight:700;margin-top:6px}
.save:disabled{opacity:.45}
.back{background:none;border:none;color:#6d9fd4;font-size:15px;padding:8px 0;margin-bottom:2px}
.lbl{font-size:12px;color:#8b9bab;text-transform:uppercase;letter-spacing:.7px;margin:14px 0 5px;font-weight:600}
.hint{font-size:12.5px;color:#7b8b9b;line-height:1.5;margin:6px 0 0}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.dot{width:26px;height:26px;border-radius:7px;background:#232f3c;font-size:9px;color:#6b7b8b;
  display:flex;align-items:center;justify-content:center}
.dot.green{background:#2fe08f;color:#0c1a13;font-weight:700}
.dot.amber{background:#f5c542;color:#2b2205;font-weight:700}
.dot.red{background:#ff6b57;color:#3a0f08;font-weight:700}
.hist{font-size:13.5px;padding:9px 0;border-bottom:1px solid #26333f;display:flex;gap:9px;align-items:baseline}
.hist:last-child{border-bottom:none}
.pill{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;flex:none}
.pill.green{background:#1d5c40;color:#2fe08f}
.pill.amber{background:#6b5313;color:#f5c542}
.pill.red{background:#6e2119;color:#ff6b57}
.warn{background:#2a1512;border:1px solid #6e2119;color:#ffb4a6;padding:11px 13px;
  border-radius:11px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.ok{background:#12261c;border:1px solid #1d5c40;color:#7fe8b5;padding:11px 13px;
  border-radius:11px;font-size:13.5px;margin-bottom:12px}
.hide{display:none}
.ctr{text-align:center;padding:52px 20px;color:#8b9bab}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .lbl{margin-top:8px}

/* --- progression, history detail and flare mode --- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#1a232e;border:1px solid #26333f;border-radius:14px;padding:11px 11px 6px;text-align:left}
.tile .gl{display:flex;align-items:center;gap:6px;font-size:12px;color:#8b9bab;font-weight:600}
.tile .gl i{width:9px;height:9px;border-radius:3px;flex:none}
.tile .v{font-size:25px;font-weight:700;margin-top:5px;line-height:1.05;letter-spacing:-.5px}
.tile .v small{font-size:12px;font-weight:600;color:#7b8b9b;letter-spacing:0}
.tile .dim{font-size:11.5px;color:#6b7b8b;margin-top:4px;line-height:1.35}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;margin-top:4px}
.chip.up{background:#12261c;color:#7fe8b5}
.chip.dn{background:#2a1512;color:#ffb4a6}
.chip.fl{background:#232f3c;color:#8b9bab}
.exrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #26333f}
.exrow:last-child{border-bottom:none}
.exrow .nm{flex:1;min-width:0}
.exrow .nm b{display:block;font-size:13.5px;font-weight:600}
.exrow .nm span{display:block;font-size:11.5px;color:#7b8b9b;margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;color:#8b9bab;font-weight:600;font-size:11px;text-transform:uppercase;
  letter-spacing:.6px;padding:5px 6px 5px 0;border-bottom:1px solid #26333f}
.tbl td{padding:6px 6px 6px 0;border-bottom:1px solid #1f2a35;color:#c8d4e0}
.tbl td:first-child{color:#8b9bab}
.stage{display:flex;gap:4px;margin:9px 0 3px}
.stage div{flex:1;height:5px;border-radius:3px;background:#2f3d4b}
.stage div.on{background:#f5c542}
.stage div.done{background:#1d5c40}
.mini{display:flex;gap:7px;margin-top:9px}
.mini button{flex:1;padding:10px 6px;border-radius:10px;border:1px solid #33424f;
  background:#1a232e;color:#c8d4e0;font-size:13px;font-weight:600}
.mini button.danger{border-color:#6e2119;color:#ff9d8b}
.tapper{width:100%;text-align:left;background:none;border:none;padding:0;color:inherit;font:inherit}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:#8b9bab;margin:2px 0 8px}
.legend i{width:14px;height:3px;border-radius:2px;flex:none}
svg.ch{display:block;width:100%;height:auto;overflow:visible}

/* --- 0-10 pain scale --- */
.pain0{display:block;width:100%;padding:12px;border-radius:10px;border:1.5px solid #2f3d4b;
  background:#232f3c;color:#7fe8b5;font-size:14px;font-weight:700;margin-bottom:5px;text-align:center}
.pain0.on{background:#1d5c40;border-color:#2fe08f;color:#fff}
.pain{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.pain button{padding:12px 0;border-radius:10px;border:1.5px solid #2f3d4b;background:#232f3c;
  color:#8b9bab;font-size:15px;font-weight:700}
.pain button.g{color:#6fd6a6}.pain button.a{color:#e0b53c}.pain button.r{color:#f08a76}
.pain button.on.g{background:#1d5c40;border-color:#2fe08f;color:#fff}
.pain button.on.a{background:#6b5313;border-color:#f5c542;color:#fff}
.pain button.on.r{background:#6e2119;border-color:#ff6b57;color:#fff}
.anch{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;color:#6b7b8b;margin-top:6px}
.derived{margin-top:11px;padding:10px 12px;border-radius:11px;font-size:12.5px;line-height:1.5}
.derived b{display:block;font-size:10.5px;letter-spacing:.8px;margin-bottom:3px}
.derived.green{background:#12261c;border:1px solid #1d5c40;color:#7fe8b5}
.derived.amber{background:#241d06;border:1px solid #6b5313;color:#f5c542}
.derived.red{background:#2a1512;border:1px solid #6e2119;color:#ffb4a6}
.pnum{font-variant-numeric:tabular-nums;font-weight:700}
</style>
</head>

var UNLOCK_DAYS = 30;

// ---------- unlock window ----------
// The passcode stays valid for UNLOCK_DAYS since it was last used. Every successful
// load or save pushes the clock forward, so regular use never prompts, while a phone
// left untouched re-locks itself.
function touch(){ try{ localStorage.setItem("pcAt", String(Date.now())); }catch(e){} }
function remember(pc){ try{ localStorage.setItem("pc", pc); }catch(e){} touch(); }
function forget(){ try{ localStorage.removeItem("pc"); localStorage.removeItem("pcAt"); }catch(e){} }
function storedPasscode(){
  var pc, at;
  try{ pc = localStorage.getItem("pc"); at = Number(localStorage.getItem("pcAt")||0); }catch(e){ return null; }
  if(!pc || !at) return null;
  if((Date.now()-at)/86400000 > UNLOCK_DAYS){ forget(); return null; }
  return pc;
}
function isAuthError(e){
  var m = String(e && e.message ? e.message : e);
  return m==="BAD_PASSCODE" || m==="NO_PASSCODE";
}

function api(action, payload){
  var body = Object.assign({action:action, passcode:S.pc}, payload||{});
  return fetch(API, {
    method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){
      if(!r.ok) throw new Error(j.error||"error"); return j; }); });
}
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function weekNum(){
  if(!S.data||!S.data.settings||!S.data.settings.program_start) return 1;
  var st=new Date(S.data.settings.program_start+"T00:00:00");
  var diff=Math.floor((new Date(today()+"T00:00:00")-st)/86400000);
  return Math.max(1, Math.floor(diff/7)+1);
}
function phaseFor(w){ return w<=4?1:(w<=12?2:3); }
function nextDay(){
  var ss=S.data&&S.data.sessions?S.data.sessions:[];
  if(!ss.length) return "A";
  var last=ss[0].day_code;
  return last==="A"?"B":(last==="B"?"C":"A");
}

}

// ==================== muscle groups, index and charts ====================
// A muscle group keeps one colour everywhere it appears. The eight hues are the
// validated categorical order, stepped for a dark surface and checked for
// colour-vision separation against this app's card background.
var GCOL = {};
(function(){
  var pal=["#3987e5","#d95926","#199e70","#c98500","#d55181","#008300","#9085e9","#e66767"];
  for(var i=0;i<GROUPS.length;i++) GCOL[GROUPS[i].k]=pal[i%pal.length];
})();

// Every exercise the programme has ever prescribed, keyed by the name stored on a
// session row. Sessions logged under an older phase stay readable after the
// exercise has left the current one.
var EX = {};
(function(){
  for(var p in PROGRAM) for(var d in PROGRAM[p]) PROGRAM[p][d].forEach(function(e){
    if(!EX[e.n]) EX[e.n]={g:e.g||null,u:e.u,t:!!e.t,s:e.s,sp:e.sp||1};
  });
})();
function gLabel(k){ for(var i=0;i<GROUPS.length;i++) if(GROUPS[i].k===k) return GROUPS[i].l; return k; }

// One comparable number per logged lift.
//   weighted  -> Epley estimated 1RM, so more reps at the same weight is progress.
//                Reps are clamped to 1-15 so one stray entry cannot swing the estimate.
//   timed     -> load scaled by how long it was carried.
//   bodyweight-> reps or seconds, the only thing that changes.
// A weighted lift with no load logged is skipped, not scored as zero: a blank is
// missing data, not a light day.
function liftMetric(l){
  var m=EX[l.n]; if(!m) return null;
  var reps=(l.reps==null||l.reps==="")?null:Number(l.reps);
  var load=(l.load==null||l.load==="")?null:Number(l.load);
  if(reps!=null&&isNaN(reps)) reps=null;
  if(load!=null&&isNaN(load)) load=null;
  if(m.u==="bw") return (reps&&reps>0)?reps:null;
  if(!load||load<=0) return null;
  if(m.t) return load*(1+Math.min(reps||30,120)/60);
  return load*(1+Math.min(Math.max(reps||1,1),15)/30);
}
function liftText(l){
  var m=EX[l.n]||{};
  var u=m.t?"s":"reps";
  var a=(l.load==null||l.load==="")?null:Number(l.load);
  var b=(l.reps==null||l.reps==="")?null:Number(l.reps);
  if(a&&b) return a+" kg x "+b+" "+u;
  if(a) return a+" kg";
  if(b) return b+" "+u;
  return "not logged";
}

// Progression is an index, not a weight. Each exercise is scored against your own
// first logged value for it (100 = that session), and a muscle group's line is the
// average of its exercises' indices. That is what makes phases comparable: the
// exercises change, the index does not.
function progression(){
  var ss=(S.data.sessions||[]).slice().sort(function(a,b){ return a.session_date<b.session_date?-1:1; });
  var byEx={};
  ss.forEach(function(x){
    var w=x.week||1;
    (x.lifts||[]).forEach(function(l){
      var m=liftMetric(l); if(m==null) return;
      if(!byEx[l.n]) byEx[l.n]=[];
      byEx[l.n].push({w:w,m:m,d:x.session_date,load:l.load,reps:l.reps});
    });
  });
  var G={}, order=[];
  GROUPS.forEach(function(g){ G[g.k]={k:g.k,l:g.l,ex:[],pts:[]}; order.push(g.k); });
  for(var n in byEx){
    var meta=EX[n]; if(!meta||!meta.g||!G[meta.g]) continue;
    var arr=byEx[n], wk={};
    arr.forEach(function(x){ (wk[x.w]=wk[x.w]||[]).push(x.m); });
    var raw=Object.keys(wk).map(Number).sort(function(a,b){return a-b;}).map(function(w){
      return {w:w, v:wk[w].reduce(function(a,b){return a+b;},0)/wk[w].length};
    });
    var base=raw[0].v; if(!base) continue;
    G[meta.g].ex.push({n:n, raw:raw,
      pts:raw.map(function(p){ return {w:p.w, v:100*p.v/base}; }),
      first:arr[0], last:arr[arr.length-1], count:arr.length});
  }
  order.forEach(function(k){ G[k].pts=chainIndex(G[k].ex); });
  return {g:G, order:order};
}

// The group line is chain-linked rather than an average of per-exercise indices.
// Averaging would enter every newly introduced exercise at 100 and so drag the whole
// group back to the start each time a phase swaps its exercises - week 5 of Phase 2
// would read as no progress since week 1. Chaining only ever moves the level by the
// ratio between two appearances of the SAME exercise: a new lift joins at the level
// the group has already reached and starts contributing from its second appearance.
// A week that links to nothing holds the level instead of resetting it.
function chainIndex(exList){
  var weeks={}, all={};
  exList.forEach(function(e){ e.raw.forEach(function(p){
    if(!weeks[p.w]) weeks[p.w]={};
    weeks[p.w][e.n]=p.v; all[p.w]=1; }); });
  var ws=Object.keys(all).map(Number).sort(function(a,b){return a-b;});
  var seen={}, level=100, out=[];
  ws.forEach(function(w){
    var row=weeks[w], names=Object.keys(row), links=[];
    names.forEach(function(n){ var pv=seen[n]; if(pv&&pv.v>0) links.push(pv.level*row[n]/pv.v); });
    if(links.length){
      // Geometric mean: an index is multiplicative, so its ratios average that way.
      var t=0; links.forEach(function(x){ t+=Math.log(x); });
      level=Math.exp(t/links.length);
    }
    out.push({w:w, v:level, n:names.length, linked:links.length});
    names.forEach(function(n){ seen[n]={v:row[n], level:level}; });
  });
  return out;
}

function lastPt(pts){ return pts.length?pts[pts.length-1]:null; }
function deltaChip(pts){
  var p=lastPt(pts); if(!p||pts.length<2) return '<span class="chip fl">one session</span>';
  var d=Math.round(p.v-100);
  return '<span class="chip '+(d>=0?"up":"dn")+'">'+(d>=0?"+":"")+d+'% since week '+pts[0].w+'</span>';
}

// A single-series line chart. Every chart here draws one series, which keeps colour
// doing one job and keeps the plot legible at phone width.
function chartSVG(pts, col, o){
  o=o||{};
  if(!pts.length) return "";
  var sp=!!o.spark, W=o.w||320, H=o.h||(sp?38:150);
  var pl=sp?2:30, pr=sp?2:34, pt=sp?5:12, pb=sp?5:22;
  var base=(o.base===undefined)?100:o.base;
  var xs=pts.map(function(p){return p.w;}), ys=pts.map(function(p){return p.v;});
  var x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  var lo,hi;
  if(o.lo!=null&&o.hi!=null){ lo=o.lo; hi=o.hi; }
  else {
    var all=base==null?ys:ys.concat([base]);
    lo=Math.min.apply(null,all); hi=Math.max.apply(null,all);
    var pad=Math.max(5,(hi-lo)*0.2); lo-=pad; hi+=pad;
  }
  function X(w){ return x1===x0 ? pl+(W-pl-pr)/2 : pl+(w-x0)/(x1-x0)*(W-pl-pr); }
  function Y(v){ return pt+(hi-v)/(hi-lo)*(H-pt-pb); }
  var fmt=o.fmt||function(v){ return Math.round(v); };
  var g="";
  // Recessive hairlines, one shade off the surface - never dashed.
  (o.marks||[]).forEach(function(m){
    g+='<line x1="'+pl+'" y1="'+Y(m.v).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(m.v).toFixed(1)
      +'" stroke="#26333f" stroke-width="1"/>';
    if(!sp&&m.l) g+='<text x="'+(pl-5)+'" y="'+(Y(m.v)+3.5).toFixed(1)
      +'" text-anchor="end" font-size="9.5" fill="#5b6b7b">'+m.l+'</text>';
  });
  if(base!=null){
    g+='<line x1="'+pl+'" y1="'+Y(base).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(base).toFixed(1)
      +'" stroke="#2f3d4b" stroke-width="1"/>';
    if(!sp) g+='<text x="'+(pl-5)+'" y="'+(Y(base)+3.5).toFixed(1)
      +'" text-anchor="end" font-size="9.5" fill="#6b7b8b">'+base+'</text>';
  }
  if(!sp){
    var xf=o.xfmt||function(p){ return "wk "+p.w; };
    g+='<text x="'+pl+'" y="'+(H-7)+'" font-size="9.5" fill="#6b7b8b">'+esc(xf(pts[0]))+'</text>';
    if(x1!==x0) g+='<text x="'+(W-pr)+'" y="'+(H-7)+'" text-anchor="end" font-size="9.5" fill="#6b7b8b">'
      +esc(xf(pts[pts.length-1]))+'</text>';
  }
  var dd=pts.map(function(p,i){ return (i?"L":"M")+X(p.w).toFixed(1)+" "+Y(p.v).toFixed(1); }).join(" ");
  g+='<path d="'+dd+'" fill="none" stroke="'+col+'" stroke-width="'+(sp?1.8:2)
    +'" stroke-linecap="round" stroke-linejoin="round"/>';
  if(!sp) pts.forEach(function(p,i){
    var on=(o.tap===i);
    g+='<circle cx="'+X(p.w).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="'+(on?5:4)
      +'" fill="'+(o.dot?o.dot(p):col)+'" stroke="#1a232e" stroke-width="2"/>';
  });
  var lp=pts[pts.length-1];
  if(sp){
    g+='<circle cx="'+X(lp.w).toFixed(1)+'" cy="'+Y(lp.v).toFixed(1)+'" r="2.8" fill="'+col+'"/>';
  } else {
    // Only the endpoint is labelled; the axis and the tap layer carry the rest.
    g+='<text x="'+(W-pr+5)+'" y="'+(Y(lp.v)+3.5).toFixed(1)+'" font-size="11" font-weight="700" fill="#c8d4e0">'
      +fmt(lp.v)+'</text>';
  }
  if(!sp && o.tapable){
    var bw=(W-pl-pr)/Math.max(1,pts.length);
    pts.forEach(function(p,i){
      // pointer-events="all" so the band is tappable despite having no visible fill;
      // each band spans a whole point's width, which keeps the target well above the
      // ~24px minimum on a phone.
      g+='<rect data-tap="'+i+'" x="'+(X(p.w)-bw/2).toFixed(1)+'" y="0" width="'+bw.toFixed(1)
        +'" height="'+H+'" fill="transparent" pointer-events="all"/>';
    });
    if(o.tap!=null && pts[o.tap]){
      var p=pts[o.tap];
      g+='<line x1="'+X(p.w).toFixed(1)+'" y1="'+pt+'" x2="'+X(p.w).toFixed(1)+'" y2="'+(H-pb)
        +'" stroke="#4d6070" stroke-width="1"/>';
    }
  }
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img">'+g+'</svg>';
}

// ==================== the 0-10 pain scale ====================
// Andreas logs a number because that is what he and his physio talk in. The traffic
// light is derived from it rather than typed, because the flare ladder, the deload
// trigger and the phase-progression rule are all written in terms of the light - and
// because a number alone cannot express the one thing that matters most: anything
// below the knee is Red at any score.
function bandFor(p){
  if(p==null) return null;
  for(var i=0;i<PAIN.bands.length;i++){ var b=PAIN.bands[i]; if(p>=b.f&&p<=b.t) return b; }
  return PAIN.bands[PAIN.bands.length-1];
}
function bandByLight(l){
  for(var i=0;i<PAIN.bands.length;i++) if(PAIN.bands[i].l===l) return PAIN.bands[i];
  return null;
}
function lightFor(p, legs){
  if(legs) return "red";
  var b=bandFor(p);
  return b?b.l:null;
}
// Rows logged before the scale existed have a light but no number. Everything that
// reads history goes through these two so those rows still display and still count.
function lightOf(row){ return row.traffic_light || lightFor(row.pain, row.leg_symptoms); }
function painOf(row){ return (row && row.pain!=null) ? row.pain : null; }

function painInput(sel, legs){
  var lo=PAIN.min, hi=PAIN.max;
  var btn=function(n){
    var b=bandFor(n), on=(sel===n);
    return '<button class="'+b.l.charAt(0)+(on?" on":"")+'" data-pain="'+n+'">'+n+'</button>';
  };
  var nums="";
  for(var n=lo+1;n<=hi;n++) nums+=btn(n);
  var b0=bandFor(lo);
  var out='<button class="pain0'+(sel===lo?" on":"")+'" data-pain="'+lo+'">'+lo
    +' &middot; '+esc(PAIN.anchors[0].t)+'</button>'
    +'<div class="pain">'+nums+'</div>'
    +'<div class="anch">'+PAIN.anchors.slice(1).map(function(a){
        return '<span>'+a.n+' '+esc(a.t)+'</span>'; }).join("")+'</div>';
  var l=lightFor(sel, legs);
  if(l){
    var b=bandByLight(l);
    out+='<div class="derived '+l+'"><b>'+l.toUpperCase()
      +(legs&&sel!=null&&bandFor(sel).l!=="red"?' &mdash; symptoms below the knee override the number':'')
      +'</b>'+esc(b?b.a:"")+'</div>';
  }
  return out;
}

// Worst score logged on each day, sessions and check-ins together, over a window.
// This is the line the physio reads, so it takes the worst of the day rather than an
// average that would flatter a bad afternoon.
function painSeries(days){
  var by={};
  (S.data.sessions||[]).forEach(function(x){
    if(x.pain!=null) by[x.session_date]=Math.max(by[x.session_date]==null?-1:by[x.session_date], x.pain); });
  (S.data.checkins||[]).forEach(function(c){
    if(c.pain!=null) by[c.checkin_date]=Math.max(by[c.checkin_date]==null?-1:by[c.checkin_date], c.pain); });
  var ks=Object.keys(by).sort();
  if(!ks.length) return [];
  var end=new Date(today()+"T00:00:00").getTime();
  var start=end-(days-1)*86400000;
  var out=[];
  ks.forEach(function(k){
    var t=new Date(k+"T00:00:00").getTime();
    if(t>=start) out.push({w:Math.round((t-start)/86400000), v:by[k], d:k});
  });
  return out;
}

// ==================== flare mode ====================
function openFlare(){
  var f=(S.data.flares||[]).filter(function(x){return !x.resolved_on;});
  return f.length?f[0]:null;
}
// The last thing that counted as a setback: the flare starting, a Red session or
// morning check-in, or a session logged with symptoms below the knee. Everything
// downstream is measured from this date, so one bad day resets the ladder.
function setbackDate(f){
  var a=f.started_on;
  (S.data.sessions||[]).forEach(function(x){
    if((x.traffic_light==="red"||x.leg_symptoms)&&x.session_date>=f.started_on&&x.session_date>a) a=x.session_date; });
  (S.data.checkins||[]).forEach(function(c){
    if(c.traffic_light==="red"&&c.checkin_date>=f.started_on&&c.checkin_date>a) a=c.checkin_date; });
  return a;
}
function clearDays(f){
  return Math.max(0, Math.round((new Date(today()+"T00:00:00")-new Date(setbackDate(f)+"T00:00:00"))/86400000));
}
function stageByN(n){ for(var i=0;i<FLARE.stages.length;i++) if(FLARE.stages[i].n===n) return FLARE.stages[i]; return null; }
function computedStage(f){
  var cd=clearDays(f), st=FLARE.stages[0];
  FLARE.stages.forEach(function(x){ if(cd>=x.d) st=x; });
  return st;
}
// A manual override holds only until the next setback; after that the ladder takes
// over again, so a step-up cannot outlive the day it was justified.
function flareStage(f){
  if(f.stage_override!=null && f.override_on && f.override_on>setbackDate(f)){
    var o=stageByN(Number(f.stage_override)); if(o) return o;
  }
  return computedStage(f);
}
function nextStage(f){
  var cur=flareStage(f);
  for(var i=0;i<FLARE.stages.length;i++) if(FLARE.stages[i].n===cur.n+1) return FLARE.stages[i];
  return null;
}
function daysUntilNext(f){
  var nx=nextStage(f); if(!nx) return null;
  return Math.max(0, nx.d-clearDays(f));
}
function roundLoad(v){
  if(v==null||isNaN(v)) return null;
  return v>=20 ? Math.round(v/2.5)*2.5 : Math.round(v*2)/2;
}
// Rewrite a prescription for the stage you are on: cap the working sets, replace the
// RPE, and state the load percentage so the number in the box has a reason.
function stageSets(str, st){
  var out=String(str||"");
  if(st.sets) out=out.replace(/^(\d+)\s*x/, function(m,n){ return Math.min(Number(n),st.sets)+" x"; });
  out=out.replace(/\s*@\s*RPE\s*[\d\-– ]*/i,"");
  if(st.rpe) out+=" @ RPE "+st.rpe;
  if(st.pct) out+=" · "+st.pct+"% of pre-flare";
  return out;
}
// What today's session actually is. With no open flare this is simply the programme.
function sessionPlan(w,p,day){
  var f=openFlare();
  if(!f) return {ex:PROGRAM[p][day], phase:p, stage:null, flare:null};
  var st=flareStage(f);
  if(!st.gym) return {ex:[], phase:p, stage:st, flare:f};
  var pool=st.pool?st.pool:p;
  if(!PROGRAM[pool]) pool=p;
  var ex=PROGRAM[pool][day].filter(function(e){ return (e.sp||1)<=st.sp; }).map(function(e){
    var c={}; for(var k in e) c[k]=e[k];
    c.s=stageSets(e.s,st);
    return c;
  });
  return {ex:ex, phase:pool, stage:st, flare:f};
}
function planLoad(e, st){
  var lv=(S.data.lastLoads||{})[e.n]||{};
  if(lv.load==null) return null;
  if(st&&st.pct) return roundLoad(Number(lv.load)*st.pct/100);
  return lv.load;
}
function currentPlan(){
  var w=weekNum(), p=phaseFor(w), d=S.form.day||nextDay();
  return sessionPlan(w,p,d);
}


// ==================== screens: flare banner, progression, session detail ====================
function flareBanner(){
  var f=openFlare(); if(!f) return "";
  var st=flareStage(f), cd=clearDays(f), nx=nextStage(f), dn=daysUntilNext(f);
  var bars=FLARE.stages.map(function(x){
    return '<div class="'+(x.n<st.n?"done":(x.n===st.n?"on":""))+'"></div>'; }).join("");
  var over=(f.stage_override!=null&&f.override_on&&f.override_on>setbackDate(f));
  var btns='';
  if(st.n>0) btns+='<button data-fl="down">Step back</button>';
  if(st.n<FLARE.stages[FLARE.stages.length-1].n) btns+='<button data-fl="up">Step up</button>';
  btns+='<button data-fl="close" class="danger">'+(S.confirmClose?"Tap again to close":"Close flare")+'</button>';
  return '<div class="warn"><b>Flare mode &middot; Stage '+st.n+' &mdash; '+esc(st.t)+'</b>'
   +'<div class="stage">'+bars+'</div>'+esc(st.sum)
   +'<div style="margin-top:7px;font-size:12.5px;color:#d9a99f">'
   + cd+' clear day'+(cd===1?"":"s")+' since '+setbackDate(f)
   + (nx?' &middot; stage '+nx.n+' ('+esc(nx.t)+') in '+dn+' day'+(dn===1?"":"s")
        :' &middot; a clear week here closes the flare')
   + (over?' &middot; stage set by hand':'')+'</div>'
   +'<div class="mini">'+btns+'</div></div>';
}


// The pain trend, and the one chart Andreas actually shows his physio. Plotted on the
// fixed 0-10 scale rather than an auto-fitted one, so a quiet fortnight looks quiet
// instead of being stretched to fill the box, with the band boundaries as hairlines.
function painCard(){
  var pts=painSeries(42);
  if(!pts.length) return '<div class="card"><div class="lbl" style="margin-top:0">Pain</div>'
    +'<p class="hint" style="margin:0">Nothing scored yet. Every session and check-in you log from '
    +'now on adds a point here.</p></div>';
  var last=pts[pts.length-1];
  var worst=0, sum=0;
  pts.forEach(function(p){ if(p.v>worst) worst=p.v; sum+=p.v; });
  var avg=sum/pts.length;
  var col=function(p){ var b=bandFor(p.v);
    return b.l==="green"?"#2fe08f":(b.l==="amber"?"#f5c542":"#ff6b57"); };
  return '<div class="card"><div class="lbl" style="margin-top:0">Pain &middot; last 6 weeks</div>'
   +'<div style="font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1">'+last.v
   +'<span style="font-size:14px;color:#7b8b9b;font-weight:600">/10 &middot; '+esc(last.d)+'</span></div>'
   +'<div class="legend" style="margin-top:10px"><i style="background:'+col(last)+'"></i>'
   +'Worst score each day &middot; dots coloured by band</div>'
   + chartSVG(pts, "#6d9fd4", {base:null, lo:-0.6, hi:10.6, dot:col,
       marks:[{v:3.5,l:"3"},{v:6.5,l:"6"}],
       xfmt:function(p){ return p.d.slice(5); }, fmt:function(v){ return Math.round(v); }})
   +'<p class="hint" style="margin-top:8px">'+pts.length+' day'+(pts.length===1?"":"s")+' scored'
   +' &middot; average '+(Math.round(avg*10)/10)+' &middot; worst '+worst
   +'. Below the lower line is Green, above the upper is Red.</p></div>';
}

function viewProgression(){
  var pr=progression();
  var out='<button class="back" data-go="home">&larr; Back</button><h2>Progression</h2>';
  var any=false; pr.order.forEach(function(k){ if(pr.g[k].pts.length) any=true; });
  if(!any) return out+painCard()
    +'<div class="card"><p class="hint" style="margin:0">No strength trend yet. '
    +'Log a few sessions with loads in them and this fills itself in.</p></div>';
  out+=painCard();
  out+='<div class="card"><p class="hint" style="margin:0">Every exercise is scored against '
   +'<b>your own first logged value for it</b> &mdash; 100 is where you started. A muscle group is the '
   +'average of its exercises, which is what lets the line survive the exercises changing between '
   +'phases. Same weight for more reps counts as progress.</p></div>';
  out+='<div class="tiles">'+pr.order.map(function(k){
    var g=pr.g[k], c=GCOL[k], lp=lastPt(g.pts), body;
    if(g.pts.length>=2){
      body='<div class="v">'+Math.round(lp.v)+'<small> idx</small></div>'+deltaChip(g.pts)
          +chartSVG(g.pts,c,{spark:1});
    } else {
      body='<div class="v" style="color:#4a5866">&mdash;</div><div class="dim">'
          +(g.ex.length?'one session so far':'nothing logged yet')+'</div>';
    }
    return '<button class="tile" data-grp="'+k+'"><div class="gl"><i style="background:'+c+'"></i>'
      +esc(g.l)+'</div>'+body+'</button>';
  }).join("")+'</div>';
  out+='<p class="hint">Tap a group to see the exercises behind it. When a phase swaps in new '
   +'exercises the line carries its level across rather than restarting, so a change of '
   +'programme never reads as lost strength. Deload weeks dip it on purpose, and a load you '
   +'left blank counts as missing, never as zero.</p>';
  return out;
}

        +(e.pts.length<2?"#6b7b8b":(ed>=0?"#7fe8b5":"#ffb4a6"))+'">'

    out+='<div class="card" style="overflow-x:auto"><table class="tbl"><thead><tr><th>Week</th>'
     +'<th>Index</th><th>Change</th><th>Linked by</th></tr></thead><tbody>'

       }).join("")+'</tbody></table></div>';

// The server's lastLoads takes the most recent value for each exercise, blanks
// included, so one session where you skipped filling a box erased the weight the app
// would otherwise prefill next time. Recompute it here carrying the last number you
// actually entered forward, load and reps independently.
function adopt(d){
  var last={};
  var ss=(d.sessions||[]).slice().sort(function(a,b){ return a.session_date<b.session_date?-1:1; });
  ss.forEach(function(x){
    (x.lifts||[]).forEach(function(l){
      if(!l||!l.n) return;
      if(!last[l.n]) last[l.n]={load:null,reps:null};
      if(l.load!=null&&l.load!=="") last[l.n].load=l.load;
      if(l.reps!=null&&l.reps!=="") last[l.n].reps=l.reps;
    });
  });
  d.lastLoads=last;
  S.data=d;
  return d;
}

// ---------- events ----------
function wire(){
  app.querySelectorAll("[data-go]").forEach(function(b){ b.onclick=function(){ go(b.dataset.go); }; });
  app.querySelectorAll("[data-pain]").forEach(function(b){ b.onclick=function(){ S.form.pain=Number(b.dataset.pain); render(); }; });
  app.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){
    // Switching day changes which exercise each input belongs to, so the typed
    // loads are cleared rather than silently landing on the wrong lift.
    Object.keys(S.form).forEach(function(k){ if(/^[lr]\d+$/.test(k)) delete S.form[k]; });
    S.form.day=b.dataset.day; render(); }; });
  app.querySelectorAll("[data-tab]").forEach(function(b){ b.onclick=function(){ S.form.tab=b.dataset.tab; window.scrollTo(0,0); render(); }; });
  app.querySelectorAll("[data-walk]").forEach(function(b){ b.onclick=function(){ S.form.walkMinutes=Number(b.dataset.walk); render(); }; });
  app.querySelectorAll("[data-sw]").forEach(function(b){ b.onclick=function(){ S.form[b.dataset.sw]=!S.form[b.dataset.sw]; render(); }; });
  app.querySelectorAll("[data-sess]").forEach(function(b){ b.onclick=function(){ S.sel=Number(b.dataset.sess); go("sess"); }; });
  app.querySelectorAll("[data-grp]").forEach(function(b){ b.onclick=function(){ S.sel=b.dataset.grp; go("progG"); }; });
  app.querySelectorAll("[data-tap]").forEach(function(b){ b.onclick=function(){ S.tap=Number(b.dataset.tap); render(); }; });
  app.querySelectorAll("[data-tbl]").forEach(function(b){ b.onclick=function(){ S.form.tbl=!S.form.tbl; render(); }; });
  app.querySelectorAll("[data-f2]").forEach(function(b){ b.onclick=function(){ S.form.newFlare=true; render(); }; });
  app.querySelectorAll("[data-fl]").forEach(function(b){ b.onclick=function(){ flareAction(b.dataset.fl, b); }; });
  app.querySelectorAll("[data-del]").forEach(function(b){ b.onclick=function(){
    if(!S.confirmDel){ S.confirmDel=true; render(); return; } delSession(b); }; });
  app.querySelectorAll("[data-f]").forEach(function(el){
    el.oninput=function(){
      var v=el.value;
      if(el.type==="range"){ S.form[el.dataset.f]=Number(v); render(); return; }
      S.form[el.dataset.f]=v;
    };
  });
  app.querySelectorAll("[data-save]").forEach(function(b){ b.onclick=function(){ save(b.dataset.save, b); }; });
}

// Reload everything and land on a screen. Every write goes through here so the
// traffic lights, the flare stage and the chart are never left showing stale data.
function refresh(btn, screen){
  return api("bootstrap").then(function(d){ adopt(d); touch(); go(screen); })
    .catch(function(e){
      btn.disabled=false;
      btn.textContent = isAuthError(e) ? "Session expired — reopen the app" : "Retry — " + e.message;
    });
}
function flareAction(kind, btn){
  var f=openFlare(); if(!f) return;
  if(kind==="close" && !S.confirmClose){ S.confirmClose=true; render(); return; }
  var payload={id:f.id}, top=FLARE.stages[FLARE.stages.length-1].n;
  if(kind==="close"){ payload.resolvedOn=today(); }
  else {
    var cur=flareStage(f).n;
    payload.stageOverride=Math.max(0,Math.min(top, cur+(kind==="up"?1:-1)));
    payload.overrideOn=today();
  }
  var here=S.screen;
  btn.disabled=true; btn.textContent="Saving...";
  api("updateFlare",payload).then(function(){ return refresh(btn, here); })
    .catch(function(e){ btn.disabled=false; btn.textContent="Retry — "+e.message; });
}
function delSession(btn){
  btn.disabled=true; btn.textContent="Deleting...";
  api("deleteSession",{id:S.sel}).then(function(){ return refresh(btn,"history"); })
    .catch(function(e){ btn.disabled=false; btn.textContent="Retry — "+e.message; });
}

function num(v){ if(v===""||v==null) return null; var n=Number(v); return isNaN(n)?null:n; }

function save(kind, btn){
  btn.disabled=true; btn.textContent="Saving...";
  var w=weekNum(), p=phaseFor(w), pr, back="home";

  if(kind==="session"){
    var plan=currentPlan();
    var d=S.form.day||nextDay();
    var lifts=plan.ex.map(function(e,i){
      var lv=(S.data.lastLoads||{})[e.n]||{};
      var def=planLoad(e,plan.stage);
      var lo=(S.form["l"+i]!==undefined)?num(S.form["l"+i]):(def!=null?def:null);
      var rp=(S.form["r"+i]!==undefined)?num(S.form["r"+i]):(lv.reps!=null?lv.reps:null);
      return {n:e.n, load:lo, reps:rp};
    });
    pr=api("saveSession",{date:today(),phase:plan.phase,week:w,day:d,
      pain:S.form.pain, light:lightFor(S.form.pain,!!S.form.legSymptoms),
      legSymptoms:!!S.form.legSymptoms,symptomNote:S.form.symptomNote,lifts:lifts,notes:S.form.notes,
      flareStage:plan.stage?plan.stage.n:null});

  } else if(kind==="editSession"){
    var row=null;
    (S.data.sessions||[]).forEach(function(y){ if(y.id===S.sel) row=y; });
    if(!row){ btn.disabled=false; btn.textContent="That session is gone"; return; }
    var edited=(row.lifts||[]).map(function(l,i){
      var lo=(S.form["l"+i]!==undefined)?num(S.form["l"+i]):(l.load!=null?l.load:null);
      var rp=(S.form["r"+i]!==undefined)?num(S.form["r"+i]):(l.reps!=null?l.reps:null);
      return {n:l.n, load:lo, reps:rp};
    });
    var np=(S.form.pain!=null)?S.form.pain:(row.pain!=null?row.pain:null);
    pr=api("updateSession",{id:S.sel, date:S.form.date||row.session_date,
      pain:np, light:(np!=null?lightFor(np,!!S.form.legSymptoms):row.traffic_light),
      legSymptoms:!!S.form.legSymptoms,
      notes:S.form.notes||null, lifts:edited});
    back="history";

  } else if(kind==="editFlare"){
    var f=openFlare();
    if(!f){ btn.disabled=false; btn.textContent="No open flare"; return; }
    pr=api("updateFlare",{id:f.id, symptomNote:S.form.symptomNote||null,
      cause:S.form.cause||null, debrief:S.form.debrief||null});

  } else if(kind==="checkin"){
    pr=api("saveCheckin",{date:today(), pain:S.form.pain,
      light:lightFor(S.form.pain,!!S.form.legSymptoms), homeRoutine:!!S.form.homeRoutine,
      walkMinutes:S.form.walkMinutes,notes:S.form.notes});

  } else if(kind==="flare"){
    pr=api("saveFlare",{date:S.form.date||today(),severity:S.form.severity!==undefined?S.form.severity:5,
      legSymptoms:S.form.legSymptoms!==undefined?!!S.form.legSymptoms:true,
      symptomNote:S.form.symptomNote,cause:S.form.cause,debrief:S.form.debrief});

  } else {
    pr=api("saveBenchmark",{date:today(),calfL:num(S.form.calfL),calfR:num(S.form.calfR),
      plankL:num(S.form.plankL),plankR:num(S.form.plankR),birdDog:num(S.form.birdDog),
      balL:num(S.form.balL),balR:num(S.form.balR),walkTol:num(S.form.walkTol),
      sitTol:num(S.form.sitTol),notes:S.form.notes});
  }

  // A Red is what starts flare mode. Logging one with no flare open opens it, so
  // the next session adapts without you having to remember a second step.
  if((kind==="session"||kind==="checkin")
     && lightFor(S.form.pain,!!S.form.legSymptoms)==="red" && !openFlare()){
    var legs = !!S.form.legSymptoms;
    var note = S.form.symptomNote || null;
    pr = pr.then(function(){
      return api("saveFlare",{date:today(),severity:5,legSymptoms:legs,symptomNote:note,
        cause:null,debrief:null});
    });
  }

  pr.then(function(){ return refresh(btn, back); })
    .catch(function(e){
      btn.disabled=false;
      btn.textContent = isAuthError(e) ? "Session expired — reopen the app" : "Retry — " + e.message;
    });
}

// ---------- boot ----------
function lockScreen(msg){
  app.innerHTML='<header><h1>Back Rehab</h1></header>'
   +(msg?'<div class="warn">'+esc(msg)+'</div>':'')
   +'<div class="card"><div class="lbl" style="margin-top:0">Passcode</div>'
   +'<input id="pc" type="password" inputmode="numeric" placeholder="Your passcode">'
   +'<p class="hint">Stays unlocked for '+UNLOCK_DAYS+' days after each use.</p>'
   +'</div><button class="save" id="go">Unlock</button>';
  var btn=document.getElementById("go");
  btn.onclick=function(){
    var v=document.getElementById("pc").value;
    if(!v){ return; }
    btn.disabled=true; btn.textContent="Checking...";
    S.pc=v;
    api("bootstrap")
      .then(function(d){ remember(v); adopt(d); go("home"); })
      .catch(function(e){
        if(isAuthError(e)){ lockScreen("Wrong passcode."); }
        else { connError("Could not reach the server — your passcode was not checked."); }
      });
  };
}

// A failed network call must not look like a failed passcode. Supabase pauses free
// projects after about a week idle, so the first call after a gap can time out while
// the database wakes; dropping to the lock screen there would look like lost data.
function connError(msg){
  app.innerHTML='<header><h1>Back Rehab</h1></header>'
   +'<div class="warn">'+esc(msg||"Could not reach the server.")+'<br><br>'
   +'If the app has been idle for a while the database may be waking up. Give it a few '
   +'seconds and try again. Nothing you have logged is affected.</div>'
   +'<button class="save" id="retry">Try again</button>';
  document.getElementById("retry").onclick=boot;
}
function setupScreen(){
  app.innerHTML='<header><h1>Back Rehab</h1><div class="sub">First-time setup</div></header>'
   +'<div class="card"><div class="lbl" style="margin-top:0">Choose a passcode</div>'
   +'<input id="pc" type="password" inputmode="numeric" placeholder="At least 4 characters">'
   +'<p class="hint">This is the only thing protecting your data. Pick something you will not forget.</p>'
   +'<div class="lbl">Programme start date</div>'
   +'<input id="st" type="date" value="'+today()+'">'
   +'<p class="hint">Week 1 of Phase 1 begins on this date. Use today if you are starting now.</p>'
   +'</div><button class="save" id="go">Create</button>';
  document.getElementById("go").onclick=function(){
    var v=document.getElementById("pc").value;
    var st=document.getElementById("st").value;
    if(v.length<4){ alert("At least 4 characters"); return; }
    fetch(API,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({action:"setPasscode",passcode:v,programStart:st})})
      .then(function(r){return r.json();})
      .then(function(){ S.pc=v; remember(v); return api("bootstrap"); })
      .then(function(d){ adopt(d); go("home"); })
      .catch(function(){ connError("Could not finish setup."); });
  };
}

function boot(){
  app.innerHTML='<div class="ctr">Loading...</div>';
  fetch(API,{method:"POST",headers:{"content-type":"application/json"},
    body:JSON.stringify({action:"status"})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(!j.hasPasscode){ setupScreen(); return; }
      var pc=storedPasscode();
      if(!pc){ lockScreen(); return; }
      S.pc=pc;
      return api("bootstrap")
        .then(function(d){ adopt(d); touch(); go("home"); })
        .catch(function(e){
          if(isAuthError(e)){ forget(); lockScreen("Please enter your passcode again."); }
          else { connError(); }
        });
    })
    .catch(function(){ connError(); });
}
boot();
</script>
